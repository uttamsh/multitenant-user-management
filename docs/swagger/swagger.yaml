securityDefinitions:
  BearerAuth:
    description: Click Authorize and enter Bearer <access JWT>, including the Bearer
      prefix and space. The validated JWT selects the tenant; client-supplied tenant
      IDs are never trusted. Roles/permissions are checked in PostgreSQL, not trusted
      from JWT claims. Never enter a refresh token here.
    in: header
    name: Authorization
    type: apiKey
