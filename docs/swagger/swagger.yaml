- tenant:update
- tenant:status
- user:create
- user:read
- user:update
- user:delete
- membership:create
- membership:update
- membership:delete
- role:create
- role:read
- role:update
- role:delete
- role_permission:assign
- role_permission:remove
- user_role:assign
- user_role:remove
- permission:read
- user_permission:read
